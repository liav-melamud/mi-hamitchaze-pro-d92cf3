name: Keep online server awake
# מעיר את שרת האונליין כל 5 דקות, כך שמי שנכנס לשחק מקבל חדר מיד
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the signaling server
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://mi-hamitchaze-signal.onrender.com/ice || true
